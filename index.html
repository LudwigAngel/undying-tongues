<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Undying Tongues · Lenguas que no mueren</title>
  <meta name="description" content="Elders record their language, children keep its candles lit. A spaced-repetition altar for endangered languages, starting with Quechua." />
  <meta name="theme-color" content="#0b0a12" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>" />
  <link rel="stylesheet" href="./src/styles.css?v=4" />
  <link rel="stylesheet" href="./src/theme.css?v=4" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>
    <canvas id="embers"></canvas>
    <svg class="andes" viewBox="0 0 1440 260" preserveAspectRatio="none">
      <path class="ridge-far" d="M0 190 L90 120 L170 160 L260 80 L340 140 L430 60 L520 130 L600 95 L690 150 L780 70 L870 135 L960 90 L1050 150 L1140 75 L1230 130 L1320 100 L1440 150 L1440 260 L0 260 Z"/>
      <path class="ridge-near" d="M0 230 L120 170 L210 205 L320 150 L420 200 L540 160 L650 215 L760 175 L880 210 L1000 165 L1110 205 L1230 170 L1340 210 L1440 185 L1440 260 L0 260 Z"/>
    </svg>
  </div>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
  <header class="top">
    <div class="brand">
      <span class="brand-flame" aria-hidden="true"></span>
      <div>
        <h1 data-i18n="title">Undying Tongues</h1>
        <p class="tagline" data-i18n="tagline">A language dies when its last voice goes quiet. Keep the candles lit.</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="lang-toggle" class="ghost-btn" type="button" aria-label="Cambiar a español">ES</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-view="altar" aria-selected="true" data-i18n="tabAltar">Altar</button>
    <button role="tab" data-view="elder" aria-selected="false" data-i18n="tabElder">Elder's voice</button>
    <button role="tab" data-view="harvest" aria-selected="false" data-i18n="tabHarvest">Story harvest</button>
    <button role="tab" data-view="practice" aria-selected="false" data-i18n="tabPractice">Keep it alive</button>
    <button role="tab" data-view="ancestor" aria-selected="false" data-i18n="tabAncestor">Talk with the ancestor</button>
  </nav>

  <main id="main" tabindex="-1"></main>

  <aside id="guide" class="guide" aria-live="polite">
    <span class="guide-spirit" aria-hidden="true"></span>
    <p class="guide-text"></p>
    <button class="guide-close" type="button">×</button>
  </aside>
  <button id="guide-summon" class="guide-summon" type="button" aria-label="Nina" title="Nina">🕯️</button>

  <footer class="foot">
    <span data-i18n="footer">Vocabulary is a draft pending review by native speakers. Recordings never leave this device.</span>
  </footer>

  <script type="module" src="./src/app.js?v=4"></script>
</body>
</html>
